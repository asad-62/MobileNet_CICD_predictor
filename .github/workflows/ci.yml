name: CI

on:
    push:
        branches:[ "main" ]
    pull_request:
        branches:[ "main" ]    


jobs: 

    test:
        runs-on: ubuntu-latest
    
        steps:
            - name: checkout repo 
              uses: actions/checkout@v4

            - name setup python
              uses: actions/setup-python@v4
              with:
                    python-version: "3.12"  

            - name: Install dependencies                    
              run: |
                    python -m pip install --upgrade pip
                    pip install -r requirements.txt
            - name: Run syntax check
                run: make syntax

            - name: Run tests
                run: make test